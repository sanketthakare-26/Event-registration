<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll | Nirvana Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Event Enrollment</h2>

        <form action="/add" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="E.g. Jane Doe" required autocomplete="name">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Submit Application</button>
        </form>

        <a href="/user" class="btn btn-ghost">← Cancel and Return</a>
    </div>
</body>
</html>
